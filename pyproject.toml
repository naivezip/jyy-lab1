[project]
name = "personal-agent"
version = "0.1.0"
description = "A minimal personal agent for the terminal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "python-dotenv>=1.0",
]

[project.scripts]
pa = "personal_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_agent"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
