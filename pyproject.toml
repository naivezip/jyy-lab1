[project]
name = "personal-agent"
version = "0.1.0"
description = "A personal agent for the terminal (refactor in progress)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
# The refactor has not landed yet; there is no package to build or install.
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
