[project]
name = "pa-agent"
version = "0.1.0"
description = "A local personal assistant CLI with a ReAct tool-calling loop."
requires-python = ">=3.12"
dependencies = [
    "openai>=3.36.1",
    "anthropic>=2.1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
pa = "assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.hatch.build.targets.wheel.force-include]
"SYSTEM.md" = "assistant/SYSTEM.md"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
